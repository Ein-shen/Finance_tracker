services:
  server:
    build: ./server
    container_name: expensekontrol-server
    env_file:
      - ./server/.env
    ports:
      - "5000:5000"

  client:
    build: ./client
    container_name: expensekontrol-client
    env_file:
      - ./client/.env
    ports:
      - "5173:5173"
    depends_on:
      - server